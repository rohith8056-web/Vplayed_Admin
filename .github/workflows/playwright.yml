name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        spec:
          - tests/login/login.spec.js
          - tests/forgetpassword/forgetpassword.spec.js
          - tests/admanagement/admanagement.spec.js
    timeout-minutes: 60
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run ${{ matrix.spec }}
        run: npx playwright test ${{ matrix.spec }} --project=chromium --workers=2
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.spec }}
          path: playwright-report/
          retention-days: 30
